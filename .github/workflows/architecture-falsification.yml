name: Architecture falsification

# Discovery-only batch probe for the architecture falsification gate. It drives
# the pre-registered sample set through the unchanged Runtime frontier and
# records where each game stops. It makes no closure claim and must not be used
# for ordinary compatibility development.

on:
  push:
    branches: ['phase/architecture-falsification-1']
    # Only an explicit change to the run request starts an expensive batch run.
    paths: ['ci/falsification-run-request.json']
  workflow_dispatch:
    inputs:
      sample_profile:
        description: Pre-registered sample set to probe
        type: choice
        options: [falsification-discovery, falsification-holdout, falsification-compensation]
        default: falsification-discovery

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.plan.outputs.profile }}
    env:
      DISPATCH_PROFILE: ${{ inputs.sample_profile }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        name: Resolve the pre-registered sample set and record run admission
        run: |
          python3 ci/falsification-admission.py >> "$GITHUB_OUTPUT"
          cat ci/falsification-run-request.json

  sample-preparation:
    needs: [admission]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore sample input cache
        id: samples-cache
        uses: actions/cache/restore@v4
        with:
          path: samples/*.apk
          enableCrossOsArchive: true
          key: agr-samples-${{ needs.admission.outputs.profile }}-v2-${{ hashFiles('Tests/Samples/fdroid.lock.json', 'Tests/Samples/fdroid.json') }}
      - name: Prepare hash-verified fixed APK inputs
        id: prepare
        run: |
          bash scripts/run-ci-stage.sh sample_preparation python3 tools/fetch_fdroid_samples.py --profile "${{ needs.admission.outputs.profile }}" --inputs-only
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Save verified sample input cache
        if: ${{ always() && steps.prepare.outcome == 'success' && steps.samples-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: samples/*.apk
          enableCrossOsArchive: true
          key: agr-samples-${{ needs.admission.outputs.profile }}-v2-${{ hashFiles('Tests/Samples/fdroid.lock.json', 'Tests/Samples/fdroid.json') }}

  frontier-probe:
    needs: [admission, sample-preparation]
    if: ${{ needs.sample-preparation.outputs.ready == 'true' }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      AGR_SIMULATOR_PROFILE: ${{ needs.admission.outputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - id: rust-version
        run: echo "key=$(rustc --version | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore prepared sample inputs
        uses: actions/cache/restore@v4
        with:
          path: samples/*.apk
          enableCrossOsArchive: true
          key: agr-samples-${{ needs.admission.outputs.profile }}-v2-${{ hashFiles('Tests/Samples/fdroid.lock.json', 'Tests/Samples/fdroid.json') }}
      - name: Restore ANGLE simulator package
        uses: actions/cache/restore@v4
        with:
          path: |
            build/angle-v2.1.28252
            build/angle-xcframeworks-v2.1.28252.zip
          key: agr-angle-ios-simulator-v2.1.28252-59e4b1f68956c92441cde4dca0e9eb1a835bbccd107cefdd1d3d3d60e27410be
      - name: Restore ARM interpreter build and Rust registry
        uses: actions/cache/restore@v4
        with:
          path: |
            Runtime/ArmInterpreter/target
            ~/.cargo/registry
            ~/.cargo/git
          key: agr-rust-${{ runner.os }}-${{ runner.arch }}-ios-simulator-aarch64-${{ steps.rust-version.outputs.key }}-${{ hashFiles('Runtime/ArmInterpreter/Cargo.toml') }}
      - name: Prepare samples and app while Simulator boots
        id: setup
        timeout-minutes: 40
        run: bash scripts/prepare-run-simulator.sh "$AGR_SIMULATOR_PROFILE"
      - name: Probe the compatibility frontier of every pre-registered sample
        id: frontier
        if: ${{ always() && steps.setup.outcome == 'success' }}
        timeout-minutes: 25
        continue-on-error: true
        env:
          ARCHITECTURE_FALSIFICATION_DISCOVERY: '1'
        run: bash scripts/run-ci-stage.sh frontier_probe bash scripts/build-and-run-simulator.sh run
      - name: Classify the frontier results
        id: classify
        if: ${{ always() }}
        continue-on-error: true
        run: |
          RESULTS=build/artifacts/architecture-falsification-discovery.json
          if [[ "${{ needs.admission.outputs.profile }}" == "falsification-compensation" ]]; then
            # One probe run covers both frozen sets; classify each against its own
            # pre-registered membership and order.
            python3 tools/classify_frontier.py --results "$RESULTS" \
              --set falsification-discovery \
              --output build/artifacts/frontier-classification-discovery.json
            python3 tools/classify_frontier.py --results "$RESULTS" \
              --set falsification-holdout \
              --output build/artifacts/frontier-classification-holdout.json
          else
            python3 tools/classify_frontier.py --results "$RESULTS" \
              --set "${{ needs.admission.outputs.profile }}" \
              --output build/artifacts/frontier-classification.json
          fi
      - name: Publish frontier evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-falsification-${{ needs.admission.outputs.profile }}
          path: |
            build/artifacts/architecture-falsification-discovery.json
            build/artifacts/architecture-falsification-discovery.log
            build/artifacts/frontier-classification.json
            build/artifacts/frontier-classification-discovery.json
            build/artifacts/frontier-classification-holdout.json
            build/artifacts/falsification-resolved.json
            build/artifacts/ci-stage-timings.jsonl
          if-no-files-found: warn
      - name: Report stage outcomes
        if: always()
        run: |
          echo "setup=${{ steps.setup.outcome }}"
          echo "frontier=${{ steps.frontier.outcome }}"
          echo "classify=${{ steps.classify.outcome }}"
          test "${{ steps.setup.outcome }}" = success
