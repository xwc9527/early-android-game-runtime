name: Frozen Bubble post-resume discovery

on:
  push:
    branches: ['phase/frozen-bubble-post-resume-1']
    paths:
      - 'Runtime/DexLoom/**'
      - 'App/main.m'
      - 'scripts/build-and-run-simulator.sh'
      - 'Tests/Samples/fdroid.json'
      - '.github/workflows/frozen-bubble-post-resume.yml'
  workflow_dispatch:
    inputs:
      run_kind:
        description: Evidence intent
        type: choice
        options: [discovery, closure]
        default: discovery

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned API19 post-resume ordering
        run: |
          python3 - <<'PY'
          import base64,hashlib,urllib.request
          url='https://android.googlesource.com/platform/frameworks/base/+/android-4.4.4_r2/core/java/android/app/Activity.java?format=TEXT'
          raw=base64.b64decode(urllib.request.urlopen(url,timeout=30).read())
          assert hashlib.sha256(raw).hexdigest()=='03874ea13f230ff2b92bc6d99522011f63a3076e9101655aa0249addc590cc4b'
          text=raw.decode()
          start=text.index('final void performResume()')
          end=text.index('final void performPause()',start)
          body=text[start:end]
          assert body.index('mInstrumentation.callActivityOnResume(this)') < body.index('onPostResume();')
          print('SOURCE_OK Activity.performResume -> onResume -> onPostResume')
          PY
      - name: Build post-resume lifecycle contract fixture
        run: |
          mkdir -p build/post-resume
          python3 Tests/DexLoom/make_activity_launch_fixture.py build/post-resume/activity-launch.dex
          bash scripts/test-dex-parser.sh build/post-resume/activity-launch.dex

  focused-simulator:
    needs: source-contract
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Simulator build cache
        uses: actions/cache@v4
        with:
          path: |
            Runtime/ArmInterpreter/target
            build/angle-v2.1.28252
            build/angle-xcframeworks-v2.1.28252.zip
          key: agr-frozen-post-resume-${{ runner.os }}-${{ hashFiles('Runtime/ArmInterpreter/Cargo.lock', 'scripts/build-and-run-simulator.sh', 'Tests/Samples/fdroid.json') }}
          restore-keys: agr-frozen-post-resume-${{ runner.os }}-
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run bounded post-resume discovery
        env:
          FROZEN_BUBBLE_POST_RESUME_DISCOVERY: '1'
        run: bash scripts/build-and-run-simulator.sh
      - name: Publish discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-bubble-post-resume-discovery
          path: |
            build/artifacts/frozen-bubble-post-resume.json
            build/artifacts/frozen-bubble-post-resume.log
          if-no-files-found: error

  runtime-regressions:
    if: ${{ inputs.run_kind == 'closure' }}
    needs: source-contract
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Runtime build cache
        uses: actions/cache@v4
        with:
          path: |
            .tools
            Vendor/ANGLE-Package
            Runtime/ArmInterpreter/target
          key: agr-frozen-post-resume-runtime-${{ runner.os }}-${{ hashFiles('Runtime/ArmInterpreter/Cargo.lock', 'scripts/build-and-run-simulator.sh', 'Tests/Samples/fdroid.json') }}
          restore-keys: agr-frozen-post-resume-runtime-${{ runner.os }}-
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Runtime contracts
        run: bash ci/run-contracts.sh
      - name: Run bounded Simulator smoke
        run: python3 scripts/run-simulator-smoke-bounded.py --timeout-seconds 900
      - name: Run Runtime and real-game regressions
        run: bash ci/run-regressions.sh
      - name: Publish Runtime regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-post-resume-runtime-regressions
          path: build/artifacts

  iphoneos:
    if: ${{ inputs.run_kind == 'closure' }}
    needs: source-contract
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore device build cache
        uses: actions/cache@v4
        with:
          path: |
            .tools
            Vendor/ANGLE-Package
            Runtime/ArmInterpreter/target
          key: agr-frozen-post-resume-device-${{ runner.os }}-${{ hashFiles('Runtime/ArmInterpreter/Cargo.lock', 'scripts/build-iphoneos.sh') }}
          restore-keys: agr-frozen-post-resume-device-${{ runner.os }}-
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build arm64 iphoneos Runtime
        run: bash scripts/build-iphoneos.sh

  closure-evidence:
    if: ${{ always() && inputs.run_kind == 'closure' }}
    needs: [source-contract, focused-simulator, runtime-regressions, iphoneos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download focused evidence
        uses: actions/download-artifact@v4
        with:
          name: frozen-bubble-post-resume-discovery
          path: build/closure-input
      - name: Build exact-commit closure summary
        if: ${{ needs.source-contract.result == 'success' && needs.focused-simulator.result == 'success' && needs.runtime-regressions.result == 'success' && needs.iphoneos.result == 'success' }}
        run: |
          python3 ci/build-frozen-post-resume-summary.py --result build/closure-input/frozen-bubble-post-resume.json
          python3 ci/validate-governance.py --mode closure --summary build/artifacts/frozen-post-resume-run-summary.json
      - name: Publish closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-post-resume-closure-summary
          path: build/artifacts/frozen-post-resume-run-summary.json
          if-no-files-found: error
      - name: Enforce complete closure opportunity
        if: always()
        run: |
          test '${{ needs.source-contract.result }}' = success
          test '${{ needs.focused-simulator.result }}' = success
          test '${{ needs.runtime-regressions.result }}' = success
          test '${{ needs.iphoneos.result }}' = success
          test -s build/artifacts/frozen-post-resume-run-summary.json
