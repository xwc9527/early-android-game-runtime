name: AGR post-merge gate

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'ci/governance/*.json'
      - 'AGENTS.md'

permissions:
  actions: read
  contents: read

jobs:
  post-merge:
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Closure selection contract
        run: python3 ci/test-post-merge-evidence.py
      - name: Verify merged tree against closure evidence
        id: identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 ci/fetch-closure-evidence.py
          python3 ci/verify-merge.py build/artifacts/closure-run-summary.json --merged
      - name: Validate current governance
        id: governance
        run: |
          python3 -m py_compile ci/*.py
          python3 ci/test-closure-attempt-ledger.py
          python3 ci/validate-governance.py --mode discovery
      - name: Critical static and JNI contract
        id: critical
        run: bash scripts/test-jni-methods.sh
      - name: Active ViewRoot contract smoke
        id: smoke
        run: python3 ci/framework-viewroot-attach-contract.py build/artifacts/framework-viewroot-attach.json
      - name: Post-merge summary
        if: always()
        run: |
          python3 ci/build-post-merge-summary.py \
            --identity-status '${{ steps.identity.outcome }}' \
            --governance-status '${{ steps.governance.outcome }}' \
            --contracts-status '${{ steps.critical.outcome }}' \
            --smoke-status '${{ steps.smoke.outcome }}'
      - name: Upload post-merge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agr-post-merge-${{ github.sha }}
          path: build/artifacts
