name: AGR AOT real entry capture

on:
  workflow_dispatch:

jobs:
  gloomy:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Capture Gloomy real compiled entry state
        env:
          AGR_OFFLINE_GLOOMY_RELOCATABLE: 1
          AGR_OFFLINE_ENTRY_POLICY: all-exidx
          AGR_GAME_COMPILER_REGION: 1
          AGR_AOT_PERF_ATTRIBUTION: 1
          AGR_AOT_CAPTURE_ONLY: 1
        run: |
          set -o pipefail
          mkdir -p build/offline-aot-gloomy-all-exidx-relocatable-attribution-capture-region-compiler
          bash tools/aot-lab/run_offline_gloomy.sh 2>&1 |
            tee build/offline-aot-gloomy-all-exidx-relocatable-attribution-capture-region-compiler/ci-log.txt
      - name: Upload raw entry fixture and build data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attribution-capture-gloomy
          path: build/offline-aot-gloomy-all-exidx-relocatable-attribution-capture-region-compiler
          if-no-files-found: error

  kungfoo:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Capture KungFoo real compiled entry state
        env:
          AGR_OFFLINE_ENTRY_POLICY: all-exidx
          AGR_OFFLINE_STAGE: oncreate
          AGR_OFFLINE_NO_DIAGNOSTIC: 1
          AGR_OFFLINE_DIRECT_LOOKUP: 1
          AGR_OFFLINE_RELOCATABLE: 1
          AGR_GAME_COMPILER_REGION: 1
          AGR_AOT_PERF_ATTRIBUTION: 1
          AGR_AOT_CAPTURE_ONLY: 1
        run: |
          set -o pipefail
          mkdir -p build/offline-aot-all-exidx-oncreate-fast-only-relocatable-region-compiler-attribution-capture
          bash tools/aot-lab/run_offline_probe.sh 2>&1 |
            tee build/offline-aot-all-exidx-oncreate-fast-only-relocatable-region-compiler-attribution-capture/ci-log.txt
      - name: Upload raw entry fixture and build data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attribution-capture-kungfoo
          path: build/offline-aot-all-exidx-oncreate-fast-only-relocatable-region-compiler-attribution-capture
          if-no-files-found: error
