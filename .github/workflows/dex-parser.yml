name: DEX parser compatibility

on:
  push:
    branches: ['phase/dex-parser-compatibility-*']
    paths:
      - 'Runtime/DexLoom/**'
      - 'Tests/DexLoom/**'
      - 'Vendor/AOSP/dalvik-api19/**'
      - 'scripts/test-dex-parser.sh'
      - 'tools/fetch_fdroid_samples.py'
      - '.github/workflows/dex-parser.yml'
  workflow_dispatch:

jobs:
  focused-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch licensed reference samples
        run: python3 tools/fetch_fdroid_samples.py --output build/dex-samples --resources build/dex-resources
      - name: Extract original classes.dex
        run: |
          python3 - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path('build/dex-samples')
          for name in ('pixel-dungeon','frozen-bubble'):
              with zipfile.ZipFile(root/f'{name}.apk') as apk:
                  (root/f'{name}.dex').write_bytes(apk.read('classes.dex'))
          PY
      - name: Run focused AGR parser
        id: parser
        shell: bash
        run: |
          set +e
          bash scripts/test-dex-parser.sh \
            build/dex-samples/pixel-dungeon.dex \
            build/dex-samples/frozen-bubble.dex | tee build/dex-parser-results.jsonl
          status=${PIPESTATUS[0]}
          while IFS= read -r result; do
            echo "::notice title=DEX parser result::$result"
          done < build/dex-parser-results.jsonl
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dex-parser-results
          path: build/dex-parser-results.jsonl
      - name: Enforce parser result
        if: always()
        run: test "${{ steps.parser.outputs.status }}" = 0
