name: DEX parser compatibility

on:
  push:
    branches: ['phase/dex-parser-compatibility-*']
    paths:
      - 'Runtime/DexLoom/**'
      - 'Tests/DexLoom/**'
      - 'Vendor/AOSP/dalvik-api19/**'
      - 'scripts/test-dex-parser.sh'
      - 'scripts/build-and-run-simulator.sh'
      - 'tools/fetch_fdroid_samples.py'
      - 'tools/scan_apks.py'
      - 'Tests/Samples/fdroid.json'
      - 'Tests/Samples/fdroid.lock.json'
      - 'App/main.m'
      - '.github/workflows/dex-parser.yml'
  workflow_dispatch:

jobs:
  focused-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Restore focused Activity sample inputs
        uses: actions/cache@v4
        with:
          path: samples/*.apk
          enableCrossOsArchive: true
          key: agr-samples-focused-activity-v2-${{ hashFiles('Tests/Samples/fdroid.lock.json', 'Tests/Samples/fdroid.json') }}
      - name: Fetch licensed reference samples
        run: python3 tools/fetch_fdroid_samples.py --profile focused-activity --output samples --resources build/dex-resources
      - name: Extract original classes.dex
        run: |
          python3 - <<'PY'
          import pathlib,zipfile
          root=pathlib.Path('samples')
          for name in ('pixel-dungeon','frozen-bubble'):
              with zipfile.ZipFile(root/f'{name}.apk') as apk:
                  (root/f'{name}.dex').write_bytes(apk.read('classes.dex'))
          PY
      - name: Build project-owned no-Bridge contract DEX
        run: python3 Tests/DexLoom/make_no_bridge_fixture.py App/Resources/classes.dex build/dex-samples/no-bridge.dex
      - name: Run focused AGR parser
        id: parser
        shell: bash
        run: |
          set +e
          bash scripts/test-dex-parser.sh \
            build/dex-samples/no-bridge.dex \
            build/dex-samples/pixel-dungeon.dex \
            build/dex-samples/frozen-bubble.dex 2>&1 | tee build/dex-parser-results.log
          status=${PIPESTATUS[0]}
          while IFS= read -r result; do
            if [[ "$status" -eq 0 ]]; then
              echo "::notice file=Tests/DexLoom/dex_parser_probe.c,title=DEX parser evidence::$result"
            else
              echo "::error file=Tests/DexLoom/dex_parser_probe.c,title=DEX parser evidence::$result"
            fi
          done < build/dex-parser-results.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dex-parser-results
          path: build/dex-parser-results.log
      - name: Enforce parser result
        if: always()
        run: test "${{ steps.parser.outputs.status }}" = 0

  focused-simulator:
    needs: focused-parser
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - id: rust-version
        run: echo "key=$(rustc --version | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore focused Activity sample inputs
        uses: actions/cache@v4
        with:
          path: samples/*.apk
          enableCrossOsArchive: true
          key: agr-samples-focused-activity-v2-${{ hashFiles('Tests/Samples/fdroid.lock.json', 'Tests/Samples/fdroid.json') }}
      - name: Restore Simulator ANGLE package
        uses: actions/cache@v4
        with:
          path: |
            build/angle-v2.1.28252
            build/angle-xcframeworks-v2.1.28252.zip
          key: agr-angle-ios-simulator-v2.1.28252-59e4b1f68956c92441cde4dca0e9eb1a835bbccd107cefdd1d3d3d60e27410be
      - name: Restore Simulator Rust artifacts and registry
        uses: actions/cache@v4
        with:
          path: |
            Runtime/ArmInterpreter/target
            ~/.cargo/registry
            ~/.cargo/git
          key: agr-rust-${{ runner.os }}-${{ runner.arch }}-ios-simulator-aarch64-${{ steps.rust-version.outputs.key }}-${{ hashFiles('Runtime/ArmInterpreter/Cargo.toml') }}
      - name: Run focused real-APK DEX probe in Simulator
        env:
          DEX_PARSER_COMPATIBILITY: '1'
        run: bash scripts/build-and-run-simulator.sh all focused-activity
      - name: Publish focused Simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dex-parser-simulator-results
          path: |
            build/artifacts/dex-parser-simulator.json
            build/artifacts/dex-parser-simulator.log
