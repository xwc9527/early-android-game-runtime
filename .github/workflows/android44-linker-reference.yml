name: Android 4.4 linker differential
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['Runtime/AospLinker/**','Runtime/Bionic/**','Runtime/Process/**','Runtime/NativeCore/**','Runtime/Ehabi/**','Tests/AospLinker/**','Tests/Ehabi/**','Tests/Android44Reference/**','Tests/Android44Dynamic/**','Tests/Android44Threads/**','Tests/Android44Unwind/**','Tests/Android44EhabiPhase2Gate/**','Tests/Android44EhabiPhase2BGate/**','scripts/build-android44-unwind-gcc.sh','scripts/build-android44-ehabi-phase2-gate.sh','scripts/build-android44-ehabi-phase2b-gate.sh','.github/workflows/android44-linker-reference.yml']
jobs:
  api19-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install API19 ARM reference and NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'emulator' 'system-images;android-19;default;armeabi-v7a' 'ndk;25.2.9519653'
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" > sdk-tools-path.txt
      - name: Build ARM32 reference fixture
        run: |
          TOOL="$ANDROID_HOME/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$TOOL/armv7a-linux-androideabi19-clang" -shared -fPIC -Wl,-z,relro,-z,now Tests/Android44Reference/linker_fixture.c -o build-reference.so
          "$TOOL/armv7a-linux-androideabi19-clang" -fPIE -pie Tests/Android44Reference/android44_reference.c -ldl -o android44-reference
          mkdir -p dynamic
          CC="$TOOL/armv7a-linux-androideabi19-clang"
          COMMON=(-shared -fPIC -Wl,--hash-style=sysv,-z,relro,-z,now -Ldynamic)
          "$CC" "${COMMON[@]}" -Wl,-soname,libagr_trace.so Tests/Android44Dynamic/trace.c -o dynamic/libagr_trace.so
          "$CC" "${COMMON[@]}" -Wl,-soname,libagr_C.so Tests/Android44Dynamic/c.c -lagr_trace -o dynamic/libagr_C.so
          "$CC" "${COMMON[@]}" -Wl,-soname,libagr_B.so Tests/Android44Dynamic/b.c -lagr_C -lagr_trace -o dynamic/libagr_B.so
          "$CC" "${COMMON[@]}" -Wl,-soname,libagr_A.so,-init,a_dt_init,-fini,a_dt_fini Tests/Android44Dynamic/a.c -lagr_B -lagr_C -lagr_trace -o dynamic/libagr_A.so
          "$CC" "${COMMON[@]}" -Wl,-soname,libagr_missing.so Tests/Android44Dynamic/missing.c -o dynamic/libagr_missing.so
          "$CC" "${COMMON[@]}" -Wl,-soname,libagr_bad_needed.so Tests/Android44Dynamic/bad_needed.c -lagr_missing -o dynamic/libagr_bad_needed.so
          "$CC" "${COMMON[@]}" -Wl,-soname,libagr_bad_symbol.so Tests/Android44Dynamic/bad_symbol.c -o dynamic/libagr_bad_symbol.so
          "$CC" -fPIE -pie Tests/Android44Dynamic/reference.c -ldl -o dynamic/android44-dynamic-reference
          "$CC" -fPIE -pie Tests/Android44Threads/reference.c -pthread -o android44-thread-reference
      - uses: actions/cache@v4
        id: ndk-r10e
        with:
          path: ${{ runner.temp }}/android-ndk-r10e
          key: android-ndk-r10e-linux-x86_64-zip
      - name: Fetch NDK r10e GCC 4.8 EHABI oracle
        if: steps.ndk-r10e.outputs.cache-hit != 'true'
        run: |
          NDK_ZIP="$RUNNER_TEMP/android-ndk-r10e-linux-x86_64.zip"
          curl -fL --retry 3 https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.zip -o "$NDK_ZIP"
          rm -rf "$RUNNER_TEMP/ndk-r10e-extract" "$RUNNER_TEMP/android-ndk-r10e"
          mkdir -p "$RUNNER_TEMP/ndk-r10e-extract"
          unzip -q "$NDK_ZIP" -d "$RUNNER_TEMP/ndk-r10e-extract"
          ROOT="$(find "$RUNNER_TEMP/ndk-r10e-extract" -type d -name android-ndk-r10e | head -n 1)"
          test -n "$ROOT"
          mv "$ROOT" "$RUNNER_TEMP/android-ndk-r10e"
      - name: Build GCC 4.8 ARM EHABI unwind fixtures
        run: |
          test -x "$RUNNER_TEMP/android-ndk-r10e/toolchains/arm-linux-androideabi-4.8/prebuilt/linux-x86_64/bin/arm-linux-androideabi-gcc"
          "$RUNNER_TEMP/android-ndk-r10e/toolchains/arm-linux-androideabi-4.8/prebuilt/linux-x86_64/bin/arm-linux-androideabi-gcc" --version | grep '4\.8'
          export NDK_R10E="$RUNNER_TEMP/android-ndk-r10e"
          export UNWIND_OUT="$GITHUB_WORKSPACE/unwind"
          bash scripts/build-android44-unwind-gcc.sh
      - name: Build and audit GCC 4.8 EHABI Phase 2 source-oracle fixtures
        run: |
          export NDK_R10E="$RUNNER_TEMP/android-ndk-r10e"
          export EHABI2_GATE_OUT="$GITHUB_WORKSPACE/ehabi2-gate"
          bash scripts/build-android44-ehabi-phase2-gate.sh
      - name: Build and audit GCC 4.8 EHABI Phase 2B typed-exception fixtures
        run: |
          export NDK_R10E="$RUNNER_TEMP/android-ndk-r10e"
          export EHABI2B_GATE_OUT="$GITHUB_WORKSPACE/ehabi2b-gate"
          set -o pipefail
          bash scripts/build-android44-ehabi-phase2b-gate.sh 2>&1 | tee ehabi2b-build.log || {
            tail -n 30 ehabi2b-build.log | while IFS= read -r line; do echo "::error title=Phase 2B source gate::$line"; done
            exit 1
          }
      - name: Audit GCC 4.8 ARM EHABI unwind fixtures
        run: |
          PRE="$RUNNER_TEMP/android-ndk-r10e/toolchains/arm-linux-androideabi-4.8/prebuilt/linux-x86_64/bin"
          READELF="$PRE/arm-linux-androideabi-readelf"
          NM="$PRE/arm-linux-androideabi-nm"
          test -x "$READELF" && test -x "$NM"
          for spec in \
            'unwind/libagr_unwind_A.so|A|B' \
            'unwind/libagr_unwind_B.so|B|C' \
            'unwind/libagr_unwind_C.so|C|agr_unwind_probe'; do
            IFS='|' read -r so symbol allow <<< "$spec"
            SIZE="$("$READELF" -S -W "$so" | awk '{
              for (i = 1; i <= NF; i++) {
                if ($i == ".ARM.exidx") { print $(i + 4); exit }
              }
            }')"
            test -n "$SIZE" && test "$SIZE" != 0 && test "$SIZE" != 000000
            "$READELF" -l -W "$so" | grep -Eq '^[[:space:]]*(ARM_)?EXIDX[[:space:]]'
            "$READELF" --unwind -W "$so" > "$so.unwind.txt"
            grep -Eq "Unwind (section|table index) '.ARM.exidx'" "$so.unwind.txt"
            grep -q "<$symbol>" "$so.unwind.txt"
            ! grep -Eiq 'corrupt|cannot decode|failed to decode' "$so.unwind.txt"
            "$READELF" -r -W "$so" > "$so.relocations.txt"
            ! grep -Eq '__aeabi_unwind_cpp_pr[012]' "$so.relocations.txt"
            ! grep -E 'R_ARM_NONE' "$so.relocations.txt" | grep -Eq '__aeabi_unwind_cpp_pr[012]'
            saw_undef=0
            while read -r und; do
              test -n "$und" || continue
              if [[ "$und" == "$allow" ]]; then
                saw_undef=1
              elif [[ "$und" =~ ^__aeabi_unwind_cpp_pr([012])$ ]]; then
                model="${BASH_REMATCH[1]}"
                grep -Eq "Compact model index:[[:space:]]*$model([[:space:]]|$)" "$so.unwind.txt"
              else
                echo "$so: unexpected dynamic undefined symbol '$und'" >&2
                exit 1
              fi
            done < <("$NM" -D -u "$so" | awk '{print $NF}')
            test "$saw_undef" -eq 1
            saw_reloc=0
            while read -r type reloc_symbol; do
              test -n "${reloc_symbol:-}" || continue
              if "$READELF" -s -W "$so" | awk -v s="$reloc_symbol" \
                 '$7=="UND" && $8==s { found=1 } END { exit !found }'; then
                if [[ "$reloc_symbol" != "$allow" ]]; then
                  echo "$so: external dynamic relocation $type targets '$reloc_symbol'; allowed only '$allow'" >&2
                  exit 1
                fi
                saw_reloc=1
              fi
            done < <(awk '$3 ~ /^R_ARM_/ && NF >= 5 { print $3, $5 }' "$so.relocations.txt")
            test "$saw_reloc" -eq 1
          done
          AVAL="$("$READELF" -s -W unwind/libagr_unwind_A.so | awk '$NF=="A" && /FUNC/ {print $2; exit}')"
          BVAL="$("$READELF" -s -W unwind/libagr_unwind_B.so | awk '$NF=="B" && /FUNC/ {print $2; exit}')"
          CVAL="$("$READELF" -s -W unwind/libagr_unwind_C.so | awk '$NF=="C" && /FUNC/ {print $2; exit}')"
          test $((0x$AVAL & 1)) -eq 1
          test $((0x$BVAL & 1)) -eq 0
          test $((0x$CVAL & 1)) -eq 1
          cover_map() {
            local so="$1" addr="$2" expect="$3"
            local map
            map="$("$READELF" -s -W "$so" | awk -v addr="$addr" '
              function h2d(h, i, c, n) {
                n=0; h=tolower(h); gsub(/^0x/,"",h)
                for (i=1;i<=length(h);i++) {
                  c=substr(h,i,1); n=n*16+index("0123456789abcdef",c)-1
                }
                return n
              }
              $4=="NOTYPE" && $5=="LOCAL" && ($NF ~ /^\$a(\.|$)/ || $NF ~ /^\$t(\.|$)/ || $NF ~ /^\$d(\.|$)/) {
                v=h2d($2); if (v<=addr && v>=best) { best=v; name=$NF }
              }
              END { if (name!="") print name }
            ')"
            test -n "$map"
            case "$expect" in
              thumb) [[ "$map" == \$t || "$map" == \$t.* ]] ;;
              arm) [[ "$map" == \$a || "$map" == \$a.* ]] ;;
              *) exit 1 ;;
            esac
          }
          cover_map unwind/libagr_unwind_A.so $((0x$AVAL & ~1)) thumb
          cover_map unwind/libagr_unwind_B.so $((0x$BVAL & ~1)) arm
          cover_map unwind/libagr_unwind_C.so $((0x$CVAL & ~1)) thumb
          test "$("$READELF" -d unwind/libagr_unwind_A.so | awk -F'[][]' '/\(NEEDED\)/{print $2}')" = libagr_unwind_B.so
          test "$("$READELF" -d unwind/libagr_unwind_B.so | awk -F'[][]' '/\(NEEDED\)/{print $2}')" = libagr_unwind_C.so
          test "$("$READELF" -d unwind/libagr_unwind_C.so | awk -F'[][]' '/\(NEEDED\)/{print $2}')" = libagr_unwind_probe.so
          ! "$READELF" -d unwind/libagr_unwind_A.so unwind/libagr_unwind_B.so unwind/libagr_unwind_C.so | grep -Ei 'libc\.so|libdl\.so|libgcc|libstdc\+\+'
          "$NM" -g unwind/libagr_unwind_probe.so | grep -q ' __gnu_Unwind_Backtrace$'
          "$NM" -g unwind/libagr_unwind_probe.so | grep -q ' __gnu_unwind_execute$'
          if "$NM" -g unwind/libagr_unwind_probe.so | grep -E ' unw_getcontext$| unw_init_local$'; then exit 1; fi
      - name: Boot Android 4.4 ARM emulator
        run: |
          SDK_TOOLS="$(cat sdk-tools-path.txt)"
          LEGACY_ROOT="$RUNNER_TEMP/android-sdk-tools-25.2.3"
          curl -fL --retry 3 https://dl.google.com/android/repository/tools_r25.2.3-linux.zip -o "$RUNNER_TEMP/tools_r25.2.3-linux.zip"
          unzip -q "$RUNNER_TEMP/tools_r25.2.3-linux.zip" -d "$LEGACY_ROOT"
          LEGACY_EMULATOR="$LEGACY_ROOT/tools/emulator"
          test -x "$LEGACY_EMULATOR"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          "$SDK_TOOLS/avdmanager" create avd --force --name agr-api19-arm --device pixel --package 'system-images;android-19;default;armeabi-v7a'
          AVD_CONFIG="$ANDROID_AVD_HOME/agr-api19-arm.avd/config.ini"
          test -f "$AVD_CONFIG"
          sed -i '/^hw.lcd.width=/d;/^hw.lcd.height=/d;/^skin.name=/d;/^skin.path=/d' "$AVD_CONFIG"
          printf 'hw.lcd.width=480\nhw.lcd.height=800\nskin.name=480x800\nskin.path=480x800\n' >> "$AVD_CONFIG"
          "$LEGACY_EMULATOR" -list-avds | grep -q '^agr-api19-arm$'
          nohup "$LEGACY_EMULATOR" @agr-api19-arm -skin 480x800 -no-window -noaudio -no-snapshot -wipe-data -no-boot-anim -gpu off > emulator.log 2>&1 &
          EMULATOR_PID=$!
          for i in $(seq 1 180); do
            if adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1$'; then break; fi
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then cat emulator.log; exit 1; fi
            sleep 5
          done
          if ! adb get-state >/dev/null 2>&1; then cat emulator.log; exit 1; fi
          adb shell getprop ro.build.version.release | tr -d '\r' | grep -q '^4\.4'
          adb shell getprop ro.product.cpu.abi | tr -d '\r' | grep -q '^armeabi-v7a$'
      - uses: dtolnay/rust-toolchain@stable
      - name: Run reference and AGR differential
        run: |
          adb push android44-reference build-reference.so /data/local/tmp/
          adb shell chmod 755 /data/local/tmp/android44-reference
          adb shell /data/local/tmp/android44-reference /data/local/tmp/build-reference.so | tr -d '\r' > android44.json
          clang -std=c11 -O2 -IRuntime/AospLinker -IRuntime/Bionic -IRuntime/Process -IRuntime/NativeCore -c Tests/Android44Reference/agr_differential.c -o agr-diff.o
          clang -std=c11 -O2 -IRuntime/Process -c Runtime/Process/agr_guest_vma.c -o agr-vma.o
          clang++ -std=gnu++98 -O2 -fno-exceptions -fno-rtti -IRuntime/AospLinker -IRuntime/Bionic -IRuntime/Process -IRuntime/NativeCore -c Runtime/AospLinker/agr_aosp_linker.cpp -o agr-linker.o
          clang++ -std=gnu++98 -O2 -fno-exceptions -fno-rtti -IRuntime/AospLinker -IRuntime/Bionic -IRuntime/Process -IRuntime/NativeCore -c Runtime/AospLinker/agr_aosp_dynamic.cpp -o agr-dynamic.o
          clang++ -std=gnu++98 -O2 -fno-exceptions -fno-rtti -IRuntime/Bionic -IRuntime/Process -c Runtime/Bionic/agr_bionic_mmap.cpp -o agr-mmap.o
          clang++ agr-diff.o agr-vma.o agr-linker.o agr-dynamic.o agr-mmap.o -o agr-differential
          ./agr-differential build-reference.so > agr.json
          python3 - <<'PY'
          import json
          a=json.load(open('android44.json')); b=json.load(open('agr.json'))
          print('Android 4.4:',json.dumps(a,sort_keys=True)); print('AGR:',json.dumps(b,sort_keys=True))
          assert a==b,(a,b)
          PY
          adb shell mkdir -p /data/local/tmp/dynamic
          adb push dynamic/android44-dynamic-reference dynamic/libagr_trace.so dynamic/libagr_C.so dynamic/libagr_B.so dynamic/libagr_A.so dynamic/libagr_bad_needed.so dynamic/libagr_bad_symbol.so /data/local/tmp/dynamic/
          adb shell chmod 755 /data/local/tmp/dynamic/android44-dynamic-reference
          adb shell 'cd /data/local/tmp/dynamic && LD_LIBRARY_PATH=/data/local/tmp/dynamic ./android44-dynamic-reference' | tr -d '\r' > android44-dynamic.json
          clang -std=c11 -O2 -Wall -Wextra -Werror -IRuntime/AospLinker -IRuntime/Bionic -IRuntime/Process -IRuntime/NativeCore -c Tests/Android44Dynamic/agr_dynamic_differential.c -o agr-dynamic-diff.o
          clang -std=c11 -O2 -IRuntime/AospLinker -IRuntime/Bionic -IRuntime/Process -IRuntime/NativeCore -c Runtime/NativeCore/agr_runtime.c -o agr-runtime.o
          cargo build --manifest-path Runtime/ArmInterpreter/Cargo.toml --release
          clang++ agr-dynamic-diff.o agr-runtime.o agr-vma.o agr-linker.o agr-dynamic.o agr-mmap.o Runtime/ArmInterpreter/target/release/libtouchhle_arm_interpreter.a -ldl -lpthread -lm -o agr-dynamic-differential
          ./agr-dynamic-differential dynamic/libagr_trace.so dynamic/libagr_C.so dynamic/libagr_B.so dynamic/libagr_A.so dynamic/libagr_bad_needed.so dynamic/libagr_bad_symbol.so dynamic/libagr_missing.so > agr-dynamic.json
          python3 - <<'PY'
          import json
          android=json.load(open('android44-dynamic.json'))
          agr=json.load(open('agr-dynamic.json'))
          print('Android 4.4 dynamic:',json.dumps(android,sort_keys=True))
          print('AGR dynamic:',json.dumps(agr,sort_keys=True))
          assert android==agr,(android,agr)
          PY
      - name: API19 pthread sync and TLS differential
        run: |
          adb push android44-thread-reference /data/local/tmp/
          adb shell chmod 755 /data/local/tmp/android44-thread-reference
          adb shell /data/local/tmp/android44-thread-reference | tr -d '\r' > android44-thread.json
          clang -std=c11 -O2 -Wall -Wextra -Werror -c \
            Runtime/Bionic/agr_bionic_thread_attr.c -o agr-bionic-thread-attr.o
          clang++ -std=c++17 -O2 -pthread -Wall -Wextra -Werror \
            Runtime/Bionic/agr_futex_host.cpp Runtime/Bionic/agr_bionic_sync.cpp \
            Runtime/Bionic/agr_bionic_tls.cpp Runtime/Bionic/agr_bionic_errno_host.cpp \
            Runtime/Bionic/agr_bionic_thread_lifecycle.cpp \
            agr-bionic-thread-attr.o \
            Tests/Android44Threads/agr_differential.cpp \
            -o agr-thread-differential
          ./agr-thread-differential > agr-thread.json
          python3 - <<'PY'
          import json
          android=json.load(open('android44-thread.json'))
          agr=json.load(open('agr-thread.json'))
          print('Android 4.4 thread:',json.dumps(android,sort_keys=True))
          print('AGR Bionic source port:',json.dumps(agr,sort_keys=True))
          for key in sorted(set(android)|set(agr)):
            if android.get(key)!=agr.get(key):
              print(f'::error title=API19 pthread differential::{key}: Android={android.get(key)!r} AGR={agr.get(key)!r}')
          assert android==agr,(android,agr)
          PY
      - name: API19 ARM EHABI unwind differential
        run: |
          bash scripts/test-ehabi-unwind.sh
          adb shell mkdir -p /data/local/tmp/unwind
          adb push unwind/android44-unwind-reference unwind/libagr_unwind_probe.so unwind/libagr_unwind_C.so unwind/libagr_unwind_B.so unwind/libagr_unwind_A.so /data/local/tmp/unwind/
          adb shell chmod 755 /data/local/tmp/unwind/android44-unwind-reference
          adb shell 'cd /data/local/tmp/unwind && LD_LIBRARY_PATH=/data/local/tmp/unwind ./android44-unwind-reference' | tr -d '\r' > android44-unwind.json
          clang -std=c11 -O2 -Wall -Wextra -Werror -IRuntime/AospLinker -IRuntime/Bionic -IRuntime/Process -IRuntime/NativeCore -IRuntime/Ehabi -IRuntime/GuestRuntime -c Tests/Android44Unwind/agr_differential.c -o agr-unwind-diff.o
          clang -std=c11 -O2 -IRuntime/AospLinker -IRuntime/Bionic -IRuntime/Process -IRuntime/NativeCore -IRuntime/Ehabi -IRuntime/GuestRuntime -c Runtime/Ehabi/agr_ehabi.c -o agr-ehabi.o
          clang++ agr-unwind-diff.o agr-ehabi.o agr-runtime.o agr-vma.o agr-linker.o agr-dynamic.o agr-mmap.o Runtime/ArmInterpreter/target/release/libtouchhle_arm_interpreter.a -ldl -lpthread -lm -o agr-unwind-differential
          ./agr-unwind-differential unwind/libagr_unwind_C.so unwind/libagr_unwind_B.so unwind/libagr_unwind_A.so > agr-unwind.json
          python3 - <<'PY'
          import json
          android=json.load(open('android44-unwind.json'))
          agr=json.load(open('agr-unwind.json'))
          print('Android 4.4 unwind:',json.dumps(android,sort_keys=True))
          print('AGR unwind:',json.dumps(agr,sort_keys=True))
          assert android.get('stop')=='fixture_boundary',android
          assert agr.get('stop')=='fixture_boundary',agr
          assert android.get('stop')==agr.get('stop'),(android,agr)
          assert len(android.get('frames',[]))==len(agr.get('frames',[])),(android,agr)
          for i,(a,b) in enumerate(zip(android['frames'],agr['frames'])):
            if a!=b:
              print(f'::error title=API19 EHABI frame {i}::{a!r} vs {b!r}')
          assert android==agr,(android,agr)
          PY
      - name: Android 4.4 GCC EHABI Phase 2 oracle gate
        run: |
          adb shell rm -rf /data/local/tmp/ehabi2
          adb shell mkdir -p /data/local/tmp/ehabi2
          adb push ehabi2-gate/libs/armeabi-v7a/. /data/local/tmp/ehabi2/
          adb shell chmod 755 /data/local/tmp/ehabi2/agr_eh2_reference
          adb shell 'cd /data/local/tmp/ehabi2 && LD_LIBRARY_PATH=/data/local/tmp/ehabi2 ./agr_eh2_reference' | tr -d '\r' > android44-ehabi2-gate.json
          python3 - <<'PY'
          import json
          result=json.load(open('android44-ehabi2-gate.json'))
          print('Android 4.4 EHABI Phase 2 oracle:',json.dumps(result,sort_keys=True))
          assert result == {
              'same':[1,2], 'cross':[10,11,12,13],
              'reload_cross':[10,11,12,13],
              'same_ok':1, 'cross_ok':1, 'reload_ok':1,
          }, result
          PY
      - name: AGR guest GCC EHABI Phase 2 differential
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            -IRuntime/AospLinker -IRuntime/Bionic -IRuntime/Process \
            -IRuntime/NativeCore -IRuntime/HostServices \
            -c Tests/Android44EhabiPhase2Gate/agr_differential.c -o agr-ehabi2-diff.o
          clang++ agr-ehabi2-diff.o agr-runtime.o agr-vma.o agr-linker.o \
            agr-dynamic.o agr-mmap.o \
            Runtime/ArmInterpreter/target/release/libtouchhle_arm_interpreter.a \
            -ldl -lpthread -lm -o agr-ehabi2-differential
          ./agr-ehabi2-differential \
            ehabi2-gate/libs/armeabi-v7a/libgnustl_shared.so \
            ehabi2-gate/libs/armeabi-v7a/libagr_eh2_probe.so \
            ehabi2-gate/libs/armeabi-v7a/libagr_eh2_same.so \
            ehabi2-gate/libs/armeabi-v7a/libagr_eh2_C.so \
            ehabi2-gate/libs/armeabi-v7a/libagr_eh2_B.so \
            ehabi2-gate/libs/armeabi-v7a/libagr_eh2_A.so \
            > agr-ehabi2-gate.json
          python3 - <<'PY'
          import json
          android=json.load(open('android44-ehabi2-gate.json'))
          agr=json.load(open('agr-ehabi2-gate.json'))
          print('Android 4.4 EHABI2:',json.dumps(android,sort_keys=True))
          print('AGR guest EHABI2:',json.dumps(agr,sort_keys=True))
          assert agr['same']==android['same'],(android,agr)
          assert agr['cross']==android['cross'],(android,agr)
          assert agr['reload_cross']==android['reload_cross'],(android,agr)
          assert agr['same_ok']==android['same_ok'],(android,agr)
          assert agr['cross_ok']==android['cross_ok'],(android,agr)
          assert agr['reload_ok']==android['reload_ok'],(android,agr)
          assert agr['unload_stale']==0,agr
          assert agr['reload_owned']==1,agr
          assert agr['exidx_mismatches']==0,agr
          assert agr['exidx'],agr
          assert {'libagr_eh2_A.so','libagr_eh2_B.so','libagr_eh2_C.so'} <= {
              event['module'] for event in agr['exidx']
          },agr['exidx']
          symbols=[event['symbol'] for event in agr['trace']]
          for required in ('__cxa_throw','_Unwind_RaiseException','__gxx_personality_v0'):
            assert any(symbol.endswith(required) for symbol in symbols),(required,symbols)
          assert 'cleanup_landing_pad' in symbols,symbols
          assert 'handler_landing_pad' in symbols,symbols
          states=[event['state'] for event in agr['trace']
                  if event['symbol'].endswith('__gxx_personality_v0')]
          assert 0 in states and 1 in states and 2 in states,states
          results=[event['result'] for event in agr['trace']
                   if event['result'] is not None]
          assert 6 in results,results
          assert 8 in results,results
          PY
      - name: Android 4.4 GCC EHABI Phase 2B typed-exception oracle
        run: |
          adb shell rm -rf /data/local/tmp/ehabi2b
          adb shell mkdir -p /data/local/tmp/ehabi2b
          adb push ehabi2b-gate/libs/armeabi-v7a/. /data/local/tmp/ehabi2b/
          adb shell chmod 755 /data/local/tmp/ehabi2b/agr_eh2b_reference
          adb shell 'cd /data/local/tmp/ehabi2b && LD_LIBRARY_PATH=/data/local/tmp/ehabi2b ./agr_eh2b_reference' | tr -d '\r' > android44-ehabi2b-gate.json
          python3 - <<'PY'
          import json
          r=json.load(open('android44-ehabi2b-gate.json'))
          print('Android 4.4 EHABI Phase 2B oracle:',json.dumps(r,sort_keys=True))
          print('::notice title=Android 4.4 Phase 2B oracle::'+json.dumps(r,sort_keys=True))
          assert r['typed']==2 and r['inheritance']==21 and r['multiple']==33,r
          assert r['pointer']==43 and r['rethrow']==54 and r['nested']==6199,r
          assert r['lifetime_ref']==r['lifetime_value']==r['lifetime_rethrow']==0,r
          assert r['cross']==r['reload_cross']==1,r
          assert r['cross_base']==71 and r['cross_derived']==74,r
          assert r['cross_events']==[810,811,812,813],r
          assert r['threads']==1 and r['thread_one']==r['thread_ret_one'],r
          assert r['thread_two']==r['thread_ret_two'] and r['thread_two']>r['thread_one']>0,r
          assert r['thread_id_one'] and r['thread_id_two'] and r['thread_id_one']!=r['thread_id_two'],r
          assert r['globals_one'] and r['globals_two'] and r['globals_one']!=r['globals_two'],r
          assert r['globals_one']==r['globals_after_one'] and r['globals_two']==r['globals_after_two'],r
          PY
      - name: AGR Linux GCC EHABI Phase 2B differential
        run: |
          clang -std=c11 -O2 -Wall -Wextra -Werror \
            -IRuntime/AospLinker -IRuntime/Bionic -IRuntime/Process \
            -IRuntime/NativeCore -IRuntime/HostServices \
            -c Tests/Android44EhabiPhase2BGate/agr_differential.c -o agr-ehabi2b-diff.o
          clang++ agr-ehabi2b-diff.o agr-runtime.o agr-vma.o agr-linker.o \
            agr-dynamic.o agr-mmap.o \
            Runtime/ArmInterpreter/target/release/libtouchhle_arm_interpreter.a \
            -ldl -lpthread -lm -o agr-ehabi2b-differential
          ./agr-ehabi2b-differential \
            ehabi2b-gate/libs/armeabi-v7a/libgnustl_shared.so \
            ehabi2b-gate/libs/armeabi-v7a/libagr_eh2b_probe.so \
            ehabi2b-gate/libs/armeabi-v7a/libagr_eh2b_types.so \
            ehabi2b-gate/libs/armeabi-v7a/libagr_eh2b_suite.so \
            ehabi2b-gate/libs/armeabi-v7a/libagr_eh2b_C.so \
            ehabi2b-gate/libs/armeabi-v7a/libagr_eh2b_B.so \
            ehabi2b-gate/libs/armeabi-v7a/libagr_eh2b_A.so \
            > agr-ehabi2b-gate.json
          python3 - <<'PY'
          import json
          a=json.load(open('android44-ehabi2b-gate.json')); b=json.load(open('agr-ehabi2b-gate.json'))
          keys=('typed','inheritance','multiple','pointer','rethrow','lifetime_ref','lifetime_ref_events','lifetime_value','lifetime_value_events','lifetime_rethrow','lifetime_rethrow_events','nested','cross','cross_events','reload_cross')
          for key in keys: assert b[key]==a[key],(key,a,b)
          assert b['unload_stale']==0 and b['reload_owned']==1,b
          assert b['exidx_mismatches']==0 and b['rtti_owned']==1,b
          assert b['rtti_owner']=='libagr_eh2b_types.so',b
          symbols=[x['symbol'] for x in b['trace']]
          for required in ('__cxa_allocate_exception','__cxa_throw','__cxa_begin_catch','__cxa_end_catch','__cxa_rethrow','__cxa_free_exception','__gxx_personality_v0'):
            assert required in symbols,(required,symbols)
          print('AGR Phase 2B:',json.dumps(b,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android44-linker-differential
          path: |
            android44.json
            agr.json
            build-reference.so
            android44-dynamic.json
            agr-dynamic.json
            dynamic/*.so
            android44-thread.json
            agr-thread.json
            android44-unwind.json
            agr-unwind.json
            unwind/*
            android44-ehabi2-gate.json
            agr-ehabi2-gate.json
            ehabi2-gate/evidence/*
            ehabi2-gate/libs/armeabi-v7a/*
            android44-ehabi2b-gate.json
            agr-ehabi2b-gate.json
            ehabi2b-gate/evidence/*
            ehabi2b-gate/libs/armeabi-v7a/*
            ehabi2b-build.log
            emulator.log

  ios-simulator-phase2a:
    needs: api19-reference
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android44-linker-differential
          path: reference-artifact
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build formal Simulator Runtime and run real-game smoke
        run: bash scripts/build-and-run-simulator.sh
      - name: Run the exact GCC 4.8 guest exception fixtures in Simulator
        run: |
          FIXTURES="$(find reference-artifact -type f -name libgnustl_shared.so -print -quit | xargs dirname)"
          test -n "$FIXTURES"
          bash scripts/test-ehabi-phase2-simulator.sh "$FIXTURES"
          python3 - <<'PY'
          import json
          android=json.load(open('reference-artifact/android44-ehabi2-gate.json'))
          simulator=json.load(open('build/artifacts/ehabi2-simulator.json'))
          for key in ('same','cross','reload_cross','same_ok','cross_ok','reload_ok'):
            assert simulator[key]==android[key],(key,android,simulator)
          PY
      - name: Run Phase 2B typed exceptions through formal GuestRuntime threads
        run: |
          FIXTURES="$(find reference-artifact -type f -name libagr_eh2b_suite.so -print -quit | xargs dirname)"
          test -n "$FIXTURES"
          bash scripts/test-ehabi-phase2b-simulator.sh "$FIXTURES"
          python3 - <<'PY'
          import json
          android=json.load(open('reference-artifact/android44-ehabi2b-gate.json'))
          ios=json.load(open('build/artifacts/ehabi2b-guest.json'))
          for key in ('typed','inheritance','multiple','pointer','rethrow','lifetime_ref','lifetime_value','lifetime_rethrow','nested','threads'):
              assert ios[key]==android[key],(key,android,ios)
          PY
      - name: Upload Simulator Phase 2A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-ehabi-phase2a
          path: build/artifacts
