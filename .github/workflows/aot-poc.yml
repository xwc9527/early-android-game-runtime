name: ARMv7 to ARM64 AOT proof

on:
  workflow_dispatch:
  push:
    branches: [experiment/armv7-arm64-aot-poc]

jobs:
  aot-poc:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Gloomy renderer AOT proof
        run: bash tools/aot-lab/run_poc.sh
      - name: Upload AOT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gloomy-armv7-arm64-aot-poc
          path: tools/aot-lab/evidence/gloomy-armv7-arm64-aot-poc
          if-no-files-found: error
