name: ARMv7 to ARM64 AOT proof

on:
  workflow_dispatch:
  push:
    branches: [experiment/armv7-arm64-aot-poc]

jobs:
  aot-poc:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run Gloomy renderer AOT proof
        run: |
          set -o pipefail
          mkdir -p tools/aot-lab/evidence/gloomy-armv7-arm64-aot-poc
          if ! bash tools/aot-lab/run_poc.sh 2>&1 | tee tools/aot-lab/evidence/gloomy-armv7-arm64-aot-poc/ci-log.txt; then
            python3 - <<'PY'
from pathlib import Path
lines = Path("tools/aot-lab/evidence/gloomy-armv7-arm64-aot-poc/ci-log.txt").read_text(errors="replace").splitlines()
keys = ("error:", "undefined symbol", "fatal error", "ld:", "Traceback", "ANGLE", "missing rust", "AGR_SMOKE_PHASE")
picked = [line.strip() for line in lines if any(key in line for key in keys)]
message = " || ".join((picked or lines)[-12:])
print("::error::" + message[:1200].replace("%", "%25"))
PY
            exit 1
          fi
      - name: Upload AOT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gloomy-armv7-arm64-aot-poc
          path: tools/aot-lab/evidence/gloomy-armv7-arm64-aot-poc
          if-no-files-found: error
