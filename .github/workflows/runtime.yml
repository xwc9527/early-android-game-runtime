name: AGR Runtime

on:
  workflow_dispatch:
    inputs:
      contracts_only:
        description: Run native contracts without the bounded Simulator smoke
        type: boolean
        default: false
      run_kind:
        description: Evidence intent
        type: choice
        options: [discovery, closure]
        default: discovery
  push:
    branches: [bionic-thread-migration, 'feature/**', 'phase/**']
    paths:
      - 'Runtime/**'
      - 'Tests/Conformance/**'
      - 'Tests/Ehabi/**'
      - 'Tests/Android44EhabiPhase2Gate/**'
      - 'Tests/Android44EhabiPhase2BGate/**'
      - 'scripts/test-ehabi-unwind.sh'
      - 'scripts/test-ehabi-phase2-simulator.sh'
      - 'scripts/test-ehabi-phase2b-simulator.sh'
      - 'App/**'
      - 'scripts/build-and-run-simulator.sh'
      - 'scripts/run-simulator-smoke-bounded.py'
      - 'scripts/run-simulator-regressions.sh'
      - 'ci/governance/expensive-run-plan.json'

jobs:
  discovery-admission:
    runs-on: ubuntu-latest
    outputs:
      admitted: ${{ steps.admission.outputs.admitted }}
    steps:
      - uses: actions/checkout@v4
      - id: admission
        env:
          RUN_KIND: ${{ inputs.run_kind || 'discovery' }}
        run: |
          if [[ "$RUN_KIND" == "closure" ]]; then
            echo "admitted=true" >> "$GITHUB_OUTPUT"
          else
            if python3 ci/validate-expensive-run.py ci/governance/expensive-run-plan.json; then
              echo "admitted=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice title=AGR discovery admission::Expensive macOS run skipped; no valid information-gain plan is enabled."
              echo "admitted=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  simulator-runtime:
    needs: discovery-admission
    if: needs.discovery-admission.outputs.admitted == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0]
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_COUNT: 1
    steps:
      - id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore toolchain and dependency caches
        uses: actions/cache@v4
        with:
          path: |
            .tools
            Vendor/ANGLE-Package
            Runtime/ArmInterpreter/target
          key: agr-${{ runner.os }}-${{ hashFiles('Runtime/ArmInterpreter/Cargo.lock', 'scripts/build-and-run-simulator.sh', 'Tests/Samples/fdroid.json') }}
          restore-keys: agr-${{ runner.os }}-
      - name: Validate governance state
        run: python3 ci/validate-governance.py --mode working
      - name: Inspect Xcode and Simulator
        run: |
          set -euxo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          xcrun simctl list runtimes available
          xcrun simctl list devices available
          xcrun --sdk iphonesimulator --show-sdk-path
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - id: contracts
        name: Run independent Runtime contracts
        continue-on-error: true
        run: bash ci/run-contracts.sh
      - name: Build and run native Runtime smoke in Simulator
        id: smoke
        continue-on-error: true
        if: ${{ inputs.contracts_only != true }}
        run: |
          set +e
          python3 scripts/run-simulator-smoke-bounded.py --timeout-seconds 900
          STATUS=$?
          if [[ $STATUS -ne 0 ]]; then
            for FILE in build/artifacts/simulator-smoke-failure.json \
                        build/artifacts/simulator-smoke-timeout.json \
                        build/artifacts/runtime-status.json \
                        build/artifacts/runtime-failure.json \
                        build/artifacts/debug-failure.json; do
              if [[ -s "$FILE" ]]; then
                echo "::error title=Simulator evidence $(basename "$FILE")::$(tr '\n' ' ' < "$FILE" | cut -c1-3000)"
              fi
            done
            if [[ -s build/artifacts/smoke-stderr.log ]]; then
              tail -n 30 build/artifacts/smoke-stderr.log | while IFS= read -r line; do
                echo "::error title=Simulator stderr::$line"
              done
            fi
            if [[ -s build/artifacts/smoke-stdout.log ]]; then
              tail -n 30 build/artifacts/smoke-stdout.log | while IFS= read -r line; do
                echo "::error title=Simulator stdout::$line"
              done
            fi
            exit $STATUS
          fi
      - name: Run existing Runtime and real-game regressions
        id: regressions
        continue-on-error: true
        if: ${{ inputs.contracts_only != true && steps.smoke.outcome == 'success' }}
        run: |
          set +e
          bash ci/run-regressions.sh
          STATUS=$?
          if [[ $STATUS -ne 0 ]]; then
            for FILE in build/artifacts/results/regressions-*.log; do
              [[ -s "$FILE" ]] || continue
              tail -n 80 "$FILE" | while IFS= read -r line; do
                echo "::error title=Regression evidence $(basename "$FILE")::$line"
              done
            done
          fi
          exit $STATUS
      - name: Build AGR run summary
        if: always()
        env:
          RUN_KIND: ${{ inputs.run_kind || 'discovery' }}
        run: |
          python3 ci/build-summary.py \
            --platform ios-simulator \
            --run-kind "$RUN_KIND" \
            --build-status '${{ steps.smoke.outcome }}' \
            --contracts-status '${{ steps.contracts.outcome }}' \
            --regressions-status '${{ steps.regressions.outcome }}' \
            --result build/artifacts/runtime-smoke.json \
            --diagnostic build/artifacts/process-forensic.json \
            --semantic-diff ci/governance/semantic-diffs/pvs1-activity-gc-root.json
      - name: Upload Simulator evidence
        id: evidence_upload
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-runtime-smoke-${{ matrix.shard }}
          path: |
            build/artifacts
            !build/artifacts/run-summary.json
      - name: Finalize closure attempt validity
        if: ${{ always() && inputs.run_kind == 'closure' && steps.evidence_upload.outcome != 'success' }}
        run: python3 ci/closure-attempt.py --invalidate-summary build/artifacts/run-summary.json --defect ARTIFACT_DEFECT
      - name: Validate closure candidate identity
        id: closure_validation
        continue-on-error: true
        if: ${{ always() && inputs.run_kind == 'closure' }}
        run: python3 ci/validate-governance.py --mode closure --summary build/artifacts/run-summary.json
      - name: Upload finalized closure summary
        if: ${{ always() && inputs.run_kind == 'closure' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-closure-summary-${{ matrix.shard }}
          path: build/artifacts/run-summary.json
      - name: Enforce Runtime result
        if: always()
        run: |
          test '${{ steps.contracts.outcome }}' = success
          if [[ '${{ inputs.contracts_only }}' != 'true' ]]; then
            test '${{ steps.smoke.outcome }}' = success
            test '${{ steps.regressions.outcome }}' = success
          fi
          if [[ '${{ inputs.run_kind }}' == 'closure' ]]; then
            test '${{ steps.closure_validation.outcome }}' = success
          fi
