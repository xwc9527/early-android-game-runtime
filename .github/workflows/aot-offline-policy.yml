name: AGR Region Compiler KungFoo probe

on:
  workflow_dispatch:

jobs:
  all-exidx-relocatable:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Compile ELF to register-resident regions and compare execution
        env:
          AGR_OFFLINE_ENTRY_POLICY: all-exidx
          AGR_OFFLINE_STAGE: oncreate
          AGR_OFFLINE_NO_DIAGNOSTIC: 1
          AGR_OFFLINE_POLICY_COMPARE: 1
          AGR_OFFLINE_DIRECT_LOOKUP: 1
          AGR_OFFLINE_RELOCATABLE: 1
          AGR_GAME_COMPILER_REGION: 1
          AGR_GAME_COMPILER_TOP_REGION: 1
        run: |
          set -o pipefail
          mkdir -p build/offline-aot-all-exidx-oncreate-fast-only-relocatable-region-compiler-top-region
          bash tools/aot-lab/run_offline_probe.sh 2>&1 |
            tee build/offline-aot-all-exidx-oncreate-fast-only-relocatable-region-compiler-top-region/ci-log.txt
      - name: Upload original execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selective-top-region-kungfoo
          path: build/offline-aot-all-exidx-oncreate-fast-only-relocatable-region-compiler-top-region
          if-no-files-found: error
