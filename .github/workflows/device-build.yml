name: AGR device build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-iphoneos.sh'
      - 'tools/fetch_fdroid_samples.py'
      - 'Tests/Samples/fdroid.lock.json'
      - 'scripts/test-ehabi-unwind.sh'
      - 'scripts/test-ehabi-phase2-simulator.sh'
      - 'scripts/test-ehabi-phase2b-simulator.sh'
      - 'App/main.m'
      - 'Runtime/**'
      - 'Tests/Ehabi/**'
      - 'Tests/Android44EhabiPhase2Gate/**'
      - 'Tests/Android44EhabiPhase2BGate/**'
      - 'scripts/build-android44-ehabi-phase2b-gate.sh'

jobs:
  iphoneos:
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      IOS_ARTIFACT_PASSWORD: ${{ secrets.IOS_ARTIFACT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - id: rust-version
        run: echo "key=$(rustc --version | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore sample input cache
        uses: actions/cache@v4
        with:
          path: samples/*.apk
          enableCrossOsArchive: true
          key: agr-samples-full-v2-${{ hashFiles('Tests/Samples/fdroid.lock.json', 'Tests/Samples/fdroid.json') }}
      - name: Restore ANGLE device package
        uses: actions/cache@v4
        with:
          path: |
            build/iphoneos/angle-v2.1.28252
            build/iphoneos/angle-xcframeworks-v2.1.28252.zip
          key: agr-angle-iphoneos-v2.1.28252-59e4b1f68956c92441cde4dca0e9eb1a835bbccd107cefdd1d3d3d60e27410be
      - name: Restore ARM interpreter build and Rust registry
        uses: actions/cache@v4
        with:
          path: |
            Runtime/ArmInterpreter/target
            ~/.cargo/registry
            ~/.cargo/git
          key: agr-rust-${{ runner.os }}-${{ runner.arch }}-iphoneos-aarch64-${{ steps.rust-version.outputs.key }}-${{ hashFiles('Runtime/ArmInterpreter/Cargo.toml') }}
      - name: Validate governance state
        run: python3 ci/validate-governance.py --mode working
      - name: Inspect device SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
      - name: API19 mmap and AOSP linker segment contracts
        run: |
          set -o pipefail
          bash scripts/test-aosp-linker.sh 2>&1 | tee linker-test.log || {
            tail -n 20 linker-test.log | while IFS= read -r line; do echo "::error title=Linker contract::$line"; done
            exit 1
          }
      - name: ARM EHABI unwind foundation contracts
        run: bash scripts/test-ehabi-unwind.sh
      - name: Set up device signing when credentials are configured
        if: env.IOS_CERTIFICATE_P12_BASE64 != '' && env.IOS_CERTIFICATE_PASSWORD != '' && env.IOS_PROVISIONING_PROFILE_BASE64 != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/agr-ci.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 -D > "$RUNNER_TEMP/certificate.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/device.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -Eo '[A-F0-9]{40}' | head -n 1)"
          test -n "$IDENTITY"
          echo "IOS_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "IOS_PROVISIONING_PROFILE=$RUNNER_TEMP/device.mobileprovision" >> "$GITHUB_ENV"
      - name: Build arm64 iPhone app
        id: device_build
        run: |
          set -o pipefail
          bash scripts/build-iphoneos.sh 2>&1 | tee iphoneos-build.log || {
            grep -E '(^|: )(fatal error|error:|undefined symbol|ld:|clang: error)' iphoneos-build.log | tail -n 30 | while IFS= read -r line; do
              echo "::error title=iPhone build::$line"
            done
            tail -n 30 iphoneos-build.log | while IFS= read -r line; do
              echo "::error title=iPhone build tail::$line"
            done
            exit 1
          }
      - name: Encrypt signed IPA for transfer through public CI
        if: env.IOS_SIGNING_IDENTITY != ''
        run: |
          set -euo pipefail
          test -n "$IOS_ARTIFACT_PASSWORD"
          openssl enc -aes-256-cbc -pbkdf2 -salt -in build/iphoneos/AGRDevice.ipa -out build/iphoneos/AGRDevice.ipa.enc -pass env:IOS_ARTIFACT_PASSWORD
      - name: Upload unsigned device link-validation build
        if: env.IOS_SIGNING_IDENTITY == ''
        uses: actions/upload-artifact@v4
        with:
          name: agr-iphoneos-arm64-unsigned
          path: |
            build/iphoneos/AGRDevice.app
            build/iphoneos/AGRDevice-unsigned.ipa
          if-no-files-found: warn
      - name: Upload encrypted signed IPA
        if: env.IOS_SIGNING_IDENTITY != ''
        uses: actions/upload-artifact@v4
        with:
          name: agr-iphoneos-arm64-signed-encrypted
          path: build/iphoneos/AGRDevice.ipa.enc
          if-no-files-found: error
      - name: Remove temporary signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/agr-ci.keychain-db" 2>/dev/null || true
      - name: Build device run summary
        if: always()
        run: |
          python3 ci/build-summary.py --platform iphoneos --run-kind build \
            --build-status '${{ steps.device_build.outcome }}' \
            --contracts-status pass --regressions-status skipped
      - name: Upload device evidence summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agr-iphoneos-run-summary
          path: build/artifacts/run-summary.json
