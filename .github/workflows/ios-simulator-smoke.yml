name: iOS Simulator smoke (bounded)

on:
  workflow_dispatch:
    inputs:
      timeout_seconds:
        description: Smoke deadline in seconds (capped at 900; use 1 to test evidence capture)
        required: false
        default: '900'

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Build and run Simulator smoke with evidence deadline
        env:
          SMOKE_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        run: python3 scripts/run-simulator-smoke-bounded.py --timeout-seconds "$SMOKE_TIMEOUT_SECONDS"
      - name: Upload smoke and timeout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-smoke-evidence
          path: build/artifacts
