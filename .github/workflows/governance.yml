name: AGR governance

on:
  pull_request:
  push:
    branches: [main, bionic-thread-migration, playable-vertical-slice-1, 'feature/**', 'phase/**', 'recovery/**']
    paths:
      - 'AGENTS.md'
      - 'docs/**'
      - 'ci/**'
      - 'tools/reference-lab/**'
      - 'artifacts/schema/**'
      - '.github/workflows/**'

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore pinned upstream source cache
        uses: actions/cache@v4
        with:
          path: build/upstream-source-cache
          key: agr-upstream-source-${{ hashFiles('ci/governance/upstream-map.json') }}
          restore-keys: agr-upstream-source-
      - name: Compile governance tools
        run: |
          python3 -m py_compile ci/*.py
          python3 -m py_compile tools/reference-lab/*.py
          python3 -m unittest discover -s tools/reference-lab -p 'test_*.py'
      - name: Validate discovery governance and upstream mapping
        run: |
          python3 ci/upstream-map.py --verify-upstream --require-valid dalvik.nativeactivity.activity_root --output build/artifacts/upstream-map-report.json
          python3 ci/validate-governance.py --mode discovery
          python3 ci/check-java-architecture-freeze.py
          python3 ci/check-java-owners.py
      - name: Validate committed semantic differentials
        run: |
          for file in ci/governance/semantic-diffs/*.json; do
            python3 ci/semantic-diff.py validate "$file"
          done
      - name: Run Framework V2 contract
        run: |
          python3 ci/framework-v2-contract.py
          python3 ci/test-evidence-classifier.py
          python3 ci/test-closure-attempt-ledger.py
      - name: Validate JSON documents
        run: |
          python3 - <<'PY'
          import json,pathlib
          files=list(pathlib.Path('ci').rglob('*.json'))+list(pathlib.Path('artifacts/schema').glob('*.json'))
          for path in files: json.loads(path.read_text(encoding='utf-8'))
          print(f'validated {len(files)} JSON documents')
          PY
      - name: Upload governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agr-governance
          path: |
            build/artifacts/governance-report.json
            build/artifacts/upstream-map-report.json
