name: AGR Region Compiler Gloomy probe

on:
  workflow_dispatch:

jobs:
  elf-only-gloomy:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Compile ELF to register-resident regions and compare execution
        env:
          AGR_OFFLINE_GLOOMY_RELOCATABLE: 1
          AGR_OFFLINE_ENTRY_POLICY: all-exidx
          AGR_GAME_COMPILER_REGION: 1
          AGR_GAME_COMPILER_TOP_REGION: 1
          AGR_AOT_SELECTIVE_BATCH: 1
          AGR_OFFLINE_GLOOMY_WARM: 1
        run: |
          set -o pipefail
          mkdir -p build/offline-aot-gloomy-all-exidx-relocatable-warm-region-compiler-top-region-batched
          bash tools/aot-lab/run_offline_gloomy.sh 2>&1 |
            tee build/offline-aot-gloomy-all-exidx-relocatable-warm-region-compiler-top-region-batched/ci-log.txt
      - name: Upload original execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selective-warm-gloomy
          path: build/offline-aot-gloomy-all-exidx-relocatable-warm-region-compiler-top-region-batched
          if-no-files-found: error
