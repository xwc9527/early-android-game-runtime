name: ARMv7 APK-prepared AOT artifact execution probe

on:
  workflow_dispatch:

jobs:
  apk-prepared-gloomy:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Execute exact artifact from APK preparation
        env:
          AGR_OFFLINE_GLOOMY_RELOCATABLE: 1
          AGR_OFFLINE_ENTRY_POLICY: all-exidx
          AGR_OFFLINE_PREPARED_DIR: tools/aot-lab/evidence/offline-generalization/run-36408196579/gloomy/elf-000-2b8672e79da3
        run: |
          set -o pipefail
          mkdir -p build/offline-aot-gloomy-all-exidx-relocatable-prepared
          bash tools/aot-lab/run_offline_gloomy.sh 2>&1 |
            tee build/offline-aot-gloomy-all-exidx-relocatable-prepared/ci-log.txt
      - name: Upload original execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-aot-apk-prepared-gloomy
          path: build/offline-aot-gloomy-all-exidx-relocatable-prepared
          if-no-files-found: error
