name: iOS Simulator Runtime

on:
  workflow_dispatch:
    inputs:
      contracts_only:
        description: Run native contracts without the bounded Simulator smoke
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'Runtime/**'
      - 'App/**'
      - 'scripts/build-and-run-simulator.sh'
      - 'scripts/run-simulator-smoke-bounded.py'
      - 'scripts/run-simulator-regressions.sh'
      - '.github/workflows/ios-simulator.yml'

jobs:
  simulator-runtime:
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0]
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_COUNT: 1
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Xcode and Simulator
        run: |
          set -euxo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          xcrun simctl list runtimes available
          xcrun simctl list devices available
          xcrun --sdk iphonesimulator --show-sdk-path
      - name: NativeCore allocator stress and sanitizer tests
        run: |
          set -o pipefail
          bash scripts/test-nativecore-allocator.sh 2>&1 | tee allocator-test.log || {
            tail -n 20 allocator-test.log | while IFS= read -r line; do echo "::error title=Allocator test::$line"; done
            exit 1
          }
      - name: JNI method registry stress and sanitizer tests
        run: bash scripts/test-jni-methods.sh
      - name: Darwin host-service contracts
        run: bash scripts/test-host-services-darwin.sh
      - name: Guest 32-bit VMA contracts
        run: bash scripts/test-guest-vma.sh
      - name: API19 mmap and AOSP linker segment contracts
        run: |
          set -o pipefail
          bash scripts/test-aosp-linker.sh 2>&1 | tee aosp-linker-test.log || {
            tail -n 12 aosp-linker-test.log | while IFS= read -r line; do echo "::error title=API19 linker contract::$line"; done
            exit 1
          }
      - name: ARM guest page-permission faults
        run: cargo test --manifest-path Runtime/ArmInterpreter/Cargo.toml --lib permission_tests
      - name: ARM per-thread CPU and shared-memory contracts
        run: |
          cargo test --manifest-path Runtime/ArmInterpreter/Cargo.toml --lib guest_threads_share_memory_but_not_registers
          cargo test --manifest-path Runtime/ArmInterpreter/Cargo.toml --lib guest_atomic_words_serialize_across_cpu_handles
          cargo test --manifest-path Runtime/ArmInterpreter/Cargo.toml --lib guest_exclusive_monitor_tests
      - name: KitKat pthread source-port and futex boundary contracts
        run: |
          set -o pipefail
          bash scripts/test-bionic-futex-host.sh 2>&1 | tee bionic-thread-test.log || {
            grep -E 'Assertion|assertion|SIGABRT|timed out|error:' bionic-thread-test.log | tail -n 6 | while IFS= read -r line; do echo "::error title=KitKat pthread assertion::$line"; done
            tail -n 6 bionic-thread-test.log | while IFS= read -r line; do echo "::error title=KitKat pthread contract::$line"; done
            exit 1
          }
      - name: Guest file-descriptor lifecycle contracts
        run: bash scripts/test-guest-fd-darwin.sh
      - name: Build and run native Runtime smoke in Simulator
        if: ${{ inputs.contracts_only != true }}
        run: python3 scripts/run-simulator-smoke-bounded.py --timeout-seconds 900
      - name: Run existing Runtime and real-game regressions
        if: ${{ inputs.contracts_only != true }}
        run: bash scripts/run-simulator-regressions.sh
      - name: Upload Simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-runtime-smoke-${{ matrix.shard }}
          path: build/artifacts
